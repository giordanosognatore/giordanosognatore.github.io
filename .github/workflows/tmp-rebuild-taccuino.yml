name: Temporary Taccuino dist regeneration
on:
  push:
    branches:
      - fix/taccuino-rimuovi-riga-ridondante
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/fix/taccuino-rimuovi-riga-ridondante'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and check static site
        run: |
          npm run build
          npm run check
      - name: Commit updated generated site to branch
        run: |
          git add dist
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: aggiorna articolo HTML dopo correzione'
            git push origin HEAD:fix/taccuino-rimuovi-riga-ridondante
          fi
          git diff --exit-code -- dist
