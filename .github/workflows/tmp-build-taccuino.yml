name: Temporary Taccuino build (feature branch only)
on:
  push:
    branches:
      - feat/taccuino-diritto-di-non-sapere
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/taccuino-diritto-di-non-sapere'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and validate static site
        run: |
          npm run build
          npm run check
      - name: Commit generated dist to the feature branch
        run: |
          git add dist
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: rigenera pagine e indici del Taccuino'
            git push origin HEAD:feat/taccuino-diritto-di-non-sapere
          fi
          git diff --exit-code -- dist
