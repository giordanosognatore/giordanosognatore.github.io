name: Temporary clean flat covers
on:
  push:
    branches:
      - fix/flat-covers-no-down-arrows

permissions:
  contents: write

jobs:
  clean-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flat-covers-no-down-arrows
          fetch-depth: 0

      - name: Ensure ImageMagick
        shell: bash
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          convert -version

      - name: Remove only the unwanted flat-cover edges
        shell: bash
        run: |
          set -euo pipefail

          shave_same_size() {
            file="$1"
            pixels="$2"
            dims="$(identify -format '%wx%h' "$file")"
            tmp="$(mktemp --suffix=.webp)"
            convert "$file" -shave "${pixels}x${pixels}" -resize "${dims}!" -quality 84 -strip "$tmp"
            mv "$tmp" "$file"
            test "$(identify -format '%wx%h' "$file")" = "$dims"
          }

          shave_same_size dist/assets/ombre-720.webp 6
          shave_same_size dist/assets/ombre-360.webp 3
          shave_same_size dist/assets/ombre-lettura-copertina.webp 6

          file=dist/assets/companion-cover.png
          w="$(identify -format '%w' "$file")"
          h="$(identify -format '%h' "$file")"
          crop_w="$((w-2))"
          tmp="$(mktemp --suffix=.png)"
          convert "$file" -crop "${crop_w}x${h}+0+0" +repage -resize "${w}x${h}!" -strip "$tmp"
          mv "$tmp" "$file"
          test "$(identify -format '%wx%h' "$file")" = "${w}x${h}"

          identify dist/assets/ombre-720.webp dist/assets/ombre-360.webp dist/assets/ombre-lettura-copertina.webp dist/assets/companion-cover.png

      - name: Regenerate and verify site
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check
          git diff --check
          if grep -R -n --include='*.html' '↓' dist; then
            echo 'Unexpected down arrow remains in generated HTML' >&2
            exit 1
          fi

      - name: Commit regenerated output and cleaned assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Ripulisci le copertine piatte e rigenera il sito"
          git push origin HEAD:fix/flat-covers-no-down-arrows
