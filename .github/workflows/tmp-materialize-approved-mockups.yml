name: Temporary materialize approved mockups
on:
  push:
    branches:
      - site/uniforma-mockup-cta

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site/uniforma-mockup-cta
          fetch-depth: 0

      - name: Decode approved mockups
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/mockups/ombre.00.b64 tmp/mockups/ombre.02.b64 tmp/mockups/ombre.03.b64 | tr -d '\n' | base64 --decode > dist/assets/ombre-mockup.webp
          cat tmp/mockups/companion.00.b64 tmp/mockups/companion.01.b64 tmp/mockups/companion.02.b64 | tr -d '\n' | base64 --decode > dist/assets/companion-mockup.webp
          test "$(stat -c %s dist/assets/ombre-mockup.webp)" -eq 20818
          test "$(stat -c %s dist/assets/companion-mockup.webp)" -eq 13734
          echo "88de0e9492b8bdb4b1d45043e31d39d86a3b74af3f53aa6a5adef8bc3ffeb28f  dist/assets/ombre-mockup.webp" | sha256sum -c -
          echo "21d957965b68995c48bb70f4543c1a902c3280ac4d77de93f6d918a00bc07213  dist/assets/companion-mockup.webp" | sha256sum -c -

      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/ombre-mockup.webp dist/assets/companion-mockup.webp
          if git diff --cached --quiet; then
            echo "Assets already materialized."
            exit 0
          fi
          git commit -m "Aggiungi mockup approvati delle opere"
          git push origin HEAD:site/uniforma-mockup-cta
